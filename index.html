<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Задачи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/locale/ru.min.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
    --text: var(--tg-theme-text-color, #222222);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #2ea6ff);
    --button: var(--tg-theme-button-color, #2ea6ff);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --border: rgba(0,0,0,0.08);
    --success-bg: #e1f5ee;
    --success-text: #085041;
    --danger-text: #a32d2d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 10px;
    border: none;
    background: var(--secondary-bg);
    color: var(--hint);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .tab.active { background: var(--button); color: var(--button-text); }

  .add-row { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--secondary-bg);
    color: var(--text);
    font-size: 15px;
  }
  input[type="text"]:focus { outline: 2px solid var(--button); }
  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: none;
    background: var(--button);
    color: var(--button-text);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .error-text { display: none; font-size: 13px; color: var(--danger-text); margin: -2px 0 8px; }

  .task-row {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--secondary-bg);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .check-btn {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--hint);
    background: none;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .check-btn.done { background: var(--success-bg); border-color: var(--success-text); color: var(--success-text); }
  .task-body { flex: 1; min-width: 0; }
  .task-text { margin: 0; font-size: 14px; }
  .task-text.done { text-decoration: line-through; color: var(--hint); }
  .task-meta { margin: 2px 0 0; font-size: 12px; color: var(--hint); }
  .del-btn { background: none; border: none; color: var(--hint); font-size: 18px; padding: 6px; cursor: pointer; flex-shrink: 0; }
  .empty { text-align: center; color: var(--hint); font-size: 14px; padding: 24px 0; }

  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav-btn { background: none; border: none; color: var(--text); font-size: 20px; padding: 6px; cursor: pointer; }
  .cal-month { font-weight: 600; font-size: 16px; text-transform: capitalize; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; text-align: center; font-size: 12px; margin-bottom: 12px; }
  .cal-weekday { color: var(--hint); font-weight: 500; padding: 4px 0; }
  .cal-day {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 2px; border-radius: 8px; border: none; background: none; color: var(--text); cursor: pointer;
    font-family: inherit;
  }
  .cal-day.selected { background: var(--button); color: var(--button-text); }
  .cal-day .num { font-size: 13px; }
  .cal-day.today .num { font-weight: 700; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--link); }
  .cal-day.selected .dot { background: var(--button-text); }
  .day-tasks-title { font-size: 13px; color: var(--hint); margin: 0 0 8px; text-transform: capitalize; }
  .day-task-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
</style>
</head>
<body>
<h1>Мои задачи</h1>

<div class="tabs">
  <button class="tab active" id="tab-list">Список</button>
  <button class="tab" id="tab-cal">Календарь</button>
</div>

<div id="view-list">
  <div class="add-row">
    <input id="new-task" type="text" placeholder="Новая задача" />
    <button class="icon-btn" id="add-btn" aria-label="Добавить"><i class="ti ti-plus"></i></button>
  </div>
  <div class="error-text" id="task-error">Введите текст задачи</div>
  <div id="task-list"></div>
</div>

<div id="view-cal" style="display:none;">
  <div class="cal-header">
    <button class="cal-nav-btn" id="prev-month" aria-label="Предыдущий месяц"><i class="ti ti-chevron-left"></i></button>
    <span class="cal-month" id="month-label"></span>
    <button class="cal-nav-btn" id="next-month" aria-label="Следующий месяц"><i class="ti ti-chevron-right"></i></button>
  </div>
  <div class="cal-grid" id="grid"></div>
  <div id="day-tasks"></div>
</div>

<script>
dayjs.locale('ru');
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const STORAGE_KEY = 'todo_tasks_v1';
let tasks = [];
let nextId = 1;
let curMonth = dayjs();
let selectedDate = dayjs().format('YYYY-MM-DD');

function saveTasks() {
  const payload = JSON.stringify({ tasks, nextId });
  if (tg && tg.CloudStorage) {
    tg.CloudStorage.setItem(STORAGE_KEY, payload, () => {});
  } else {
    try { localStorage.setItem(STORAGE_KEY, payload); } catch (e) {}
  }
}

function loadTasks(cb) {
  const applyDefaults = () => {
    tasks = [
      { id: 1, text: 'Отправить документ HR', date: dayjs().format('YYYY-MM-DD'), done: false, remind: true },
      { id: 2, text: 'Проверить прототип', date: dayjs().add(1, 'day').format('YYYY-MM-DD'), done: false, remind: false }
    ];
    nextId = 3;
    cb();
  };
  const parse = (raw) => {
    if (!raw) { applyDefaults(); return; }
    try {
      const data = JSON.parse(raw);
      tasks = data.tasks || [];
      nextId = data.nextId || (tasks.length + 1);
      cb();
    } catch (e) { applyDefaults(); }
  };
  if (tg && tg.CloudStorage) {
    tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => parse(value));
  } else {
    try { parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { applyDefaults(); }
  }
}

const listView = document.getElementById('view-list');
const calView = document.getElementById('view-cal');
const tabList = document.getElementById('tab-list');
const tabCal = document.getElementById('tab-cal');

function setTab(which) {
  const isList = which === 'list';
  listView.style.display = isList ? 'block' : 'none';
  calView.style.display = isList ? 'none' : 'block';
  tabList.classList.toggle('active', isList);
  tabCal.classList.toggle('active', !isList);
  if (!isList) renderCalendar();
}
tabList.onclick = () => setTab('list');
tabCal.onclick = () => setTab('cal');

function renderList() {
  const wrap = document.getElementById('task-list');
  wrap.innerHTML = '';
  const sorted = [...tasks].sort((a, b) => a.date.localeCompare(b.date));
  if (sorted.length === 0) {
    wrap.innerHTML = '<p class="empty">Задач пока нет</p>';
    return;
  }
  sorted.forEach(t => {
    const row = document.createElement('div');
    row.className = 'task-row';
    const dateLabel = dayjs(t.date).format('D MMM');
    row.innerHTML = `
      <button class="check-btn ${t.done ? 'done' : ''}" aria-label="Отметить выполненной">${t.done ? '<i class="ti ti-check" style="font-size:14px;"></i>' : ''}</button>
      <div class="task-body">
        <p class="task-text ${t.done ? 'done' : ''}">${escapeHtml(t.text)}</p>
        <p class="task-meta">${dateLabel}${t.remind ? ' &middot; <i class="ti ti-bell" style="font-size:11px;"></i> напоминание' : ''}</p>
      </div>
      <button class="del-btn" aria-label="Удалить"><i class="ti ti-trash"></i></button>
    `;
    row.querySelector('.check-btn').onclick = () => { t.done = !t.done; saveTasks(); renderList(); };
    row.querySelector('.del-btn').onclick = () => { tasks = tasks.filter(x => x.id !== t.id); saveTasks(); renderList(); };
    wrap.appendChild(row);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('add-btn').onclick = addTask;
document.getElementById('new-task').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTask();
});
document.getElementById('new-task').oninput = () => {
  document.getElementById('task-error').style.display = 'none';
};

function addTask() {
  const input = document.getElementById('new-task');
  const err = document.getElementById('task-error');
  const val = input.value.trim();
  if (!val) { err.style.display = 'block'; return; }
  err.style.display = 'none';
  tasks.push({ id: nextId++, text: val, date: dayjs().format('YYYY-MM-DD'), done: false, remind: false });
  input.value = '';
  saveTasks();
  renderList();
}

function renderCalendar() {
  document.getElementById('month-label').textContent = curMonth.format('MMMM YYYY');
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-weekday';
    el.textContent = d;
    grid.appendChild(el);
  });
  const startOfMonth = curMonth.startOf('month');
  const startWeekday = (startOfMonth.day() + 6) % 7;
  const daysInMonth = curMonth.daysInMonth();
  for (let i = 0; i < startWeekday; i++) grid.appendChild(document.createElement('div'));
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = curMonth.date(d).format('YYYY-MM-DD');
    const dayTasks = tasks.filter(t => t.date === dateStr);
    const cell = document.createElement('button');
    cell.className = 'cal-day';
    if (dateStr === selectedDate) cell.classList.add('selected');
    if (dateStr === dayjs().format('YYYY-MM-DD')) cell.classList.add('today');
    cell.innerHTML = `<span class="num">${d}</span>${dayTasks.length ? '<span class="dot"></span>' : '<span style="width:4px;height:4px;margin-top:0;"></span>'}`;
    cell.onclick = () => { selectedDate = dateStr; renderCalendar(); };
    grid.appendChild(cell);
  }
  const dayWrap = document.getElementById('day-tasks');
  const dayTasks = tasks.filter(t => t.date === selectedDate);
  dayWrap.innerHTML = `<p class="day-tasks-title">${dayjs(selectedDate).format('D MMMM')}</p>`;
  if (dayTasks.length === 0) {
    dayWrap.innerHTML += '<p class="empty" style="padding:8px 0;">Нет задач на этот день</p>';
  } else {
    dayTasks.forEach(t => {
      const row = document.createElement('div');
      row.className = 'day-task-row';
      row.innerHTML = `<span style="flex:1; ${t.done ? 'text-decoration:line-through; color:var(--hint);' : ''}">${escapeHtml(t.text)}</span>${t.remind ? '<i class="ti ti-bell" style="font-size:14px; color:var(--hint);"></i>' : ''}`;
      dayWrap.appendChild(row);
    });
  }
}
document.getElementById('prev-month').onclick = () => { curMonth = curMonth.subtract(1, 'month'); renderCalendar(); };
document.getElementById('next-month').onclick = () => { curMonth = curMonth.add(1, 'month'); renderCalendar(); };

loadTasks(() => renderList());
</script>
</body>
</html>
