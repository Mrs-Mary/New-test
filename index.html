<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Мои задачи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ---------- Тема ---------- */
  :root {
    /* запасные значения, если Telegram не отдал тему (браузер, отладка) */
    --fb-bg: #ffffff;
    --fb-sec: #f2f3f5;
    --fb-text: #0f1419;
    --fb-hint: #8b95a1;
    --fb-link: #2f81f7;
    --fb-btn: #2f81f7;
    --fb-btn-text: #ffffff;
    --fb-border: rgba(0,0,0,.07);
    --fb-elev: rgba(0,0,0,.06);
    --fb-overlay: rgba(15,20,25,.42);
    --fb-surface: #ffffff;
  }
  [data-scheme="dark"] {
    --fb-bg: #17212b;
    --fb-sec: #232e3c;
    --fb-text: #f1f3f5;
    --fb-hint: #8a97a5;
    --fb-link: #62a8ea;
    --fb-btn: #4b8fdc;
    --fb-btn-text: #ffffff;
    --fb-border: rgba(255,255,255,.09);
    --fb-elev: rgba(0,0,0,.4);
    --fb-overlay: rgba(0,0,0,.6);
    --fb-surface: #232e3c;
  }
  :root {
    --bg: var(--tg-theme-bg-color, var(--fb-bg));
    --sec: var(--tg-theme-secondary-bg-color, var(--fb-sec));
    --surface: var(--tg-theme-section-bg-color, var(--fb-surface));
    --text: var(--tg-theme-text-color, var(--fb-text));
    --hint: var(--tg-theme-hint-color, var(--fb-hint));
    --link: var(--tg-theme-link-color, var(--fb-link));
    --accent: var(--tg-theme-button-color, var(--fb-btn));
    --accent-text: var(--tg-theme-button-text-color, var(--fb-btn-text));
    --border: var(--fb-border);
    --elev: var(--fb-elev);
    --overlay: var(--fb-overlay);
    --danger: #e5484d;
    --warn: #f5a524;
    --ok: #2bb673;
    --r-sm: 10px;
    --r-md: 14px;
    --r-lg: 20px;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
 
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 400 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button, input { font: inherit; color: inherit; }
  button { border: none; background: none; cursor: pointer; }
  .app { max-width: 560px; margin: 0 auto; padding: 14px 16px calc(190px + var(--safe-b)); }
 
  /* ---------- Шапка ---------- */
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .head h1 { font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
  .head .sub { font-size: 13px; color: var(--hint); margin: 0; }
  .ring { width: 44px; height: 44px; flex-shrink: 0; position: relative; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .ring .track { stroke: var(--sec); }
  .ring .bar { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .45s cubic-bezier(.4,0,.2,1); }
  .ring span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
 
  /* ---------- Вкладки ---------- */
  .tabs {
    position: relative; display: flex; background: var(--sec);
    border-radius: var(--r-md); padding: 3px; margin-bottom: 14px;
  }
  .tabs .glider {
    position: absolute; top: 3px; left: 3px; bottom: 3px; width: calc(50% - 3px);
    background: var(--accent); border-radius: 11px;
    transition: transform .28s cubic-bezier(.4,0,.2,1);
  }
  .tabs.cal .glider { transform: translateX(100%); }
  .tab {
    position: relative; z-index: 1; flex: 1; padding: 9px 4px; border-radius: 11px;
    font-size: 14px; font-weight: 600; color: var(--hint);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: color .22s ease;
  }
  .tab.active { color: var(--accent-text); }
  .tab svg { width: 16px; height: 16px; }
 
  /* ---------- Фильтры ---------- */
  .filters { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    padding: 6px 12px; border-radius: 999px; background: var(--sec); color: var(--hint);
    font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .18s, color .18s;
  }
  .chip.on { background: var(--accent); color: var(--accent-text); }
  .chip .cnt { opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
 
  /* ---------- Группы и задачи ---------- */
  .group + .group { margin-top: 18px; }
  .group-title {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--hint); margin: 0 0 8px 2px;
  }
  .group-title.overdue { color: var(--danger); }
  .group-title .n { font-weight: 500; opacity: .7; letter-spacing: 0; text-transform: none; }
 
  .row {
    display: flex; align-items: flex-start; gap: 11px;
    background: var(--sec); border-radius: var(--r-md); padding: 12px;
    margin-bottom: 7px; animation: pop .22s cubic-bezier(.34,1.3,.64,1);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.985); } }
  .row.is-done { opacity: .55; }
 
  .check {
    width: 23px; height: 23px; margin-top: 1px; border-radius: 50%;
    border: 2px solid var(--hint); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, border-color .2s, transform .12s;
  }
  .check:active { transform: scale(.86); }
  .check svg { width: 13px; height: 13px; stroke-dasharray: 22; stroke-dashoffset: 22; }
  .check.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .check.on svg { animation: draw .3s ease forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
 
  .body { flex: 1; min-width: 0; text-align: left; }
  .title { font-size: 15px; line-height: 1.35; margin: 0; word-break: break-word; }
  .title.struck { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--hint); }
  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin: 4px 0 0; font-size: 12px; color: var(--hint); }
  .meta .pill { display: inline-flex; align-items: center; gap: 4px; }
  .meta .pill svg { width: 12px; height: 12px; }
  .meta .late { color: var(--danger); font-weight: 600; }
  .meta .bell { color: var(--warn); }
 
  .del { width: 30px; height: 30px; flex-shrink: 0; border-radius: 8px; color: var(--hint); display: flex; align-items: center; justify-content: center; transition: color .18s, background .18s; }
  .del:active { color: var(--danger); background: var(--bg); }
  .del svg { width: 17px; height: 17px; }
 
  .empty { text-align: center; padding: 40px 16px; color: var(--hint); }
  .empty svg { width: 40px; height: 40px; opacity: .35; margin-bottom: 10px; }
  .empty p { margin: 0; font-size: 14px; }
 
  /* ---------- Композер ---------- */
  .composer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--bg); border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + var(--safe-b));
    box-shadow: 0 -6px 24px var(--elev);
  }
  .composer-in { max-width: 560px; margin: 0 auto; }
  .field { display: flex; gap: 8px; align-items: center; }
  .field input[type="text"] {
    flex: 1; min-width: 0; padding: 11px 14px; border-radius: var(--r-md);
    border: 1.5px solid transparent; background: var(--sec); font-size: 15px;
    transition: border-color .18s;
  }
  .field input[type="text"]::placeholder { color: var(--hint); }
  .field input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .field input.err { border-color: var(--danger); }
  .send {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: var(--r-md);
    background: var(--accent); color: var(--accent-text);
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s, opacity .18s;
  }
  .send:active { transform: scale(.92); }
  .send svg { width: 20px; height: 20px; }
  .opts { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  .opts::-webkit-scrollbar { display: none; }
  .opt {
    position: relative; display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 11px; border-radius: 999px; background: var(--sec); color: var(--hint);
    font-size: 13px; white-space: nowrap; transition: background .18s, color .18s;
  }
  .opt svg { width: 14px; height: 14px; }
  .opt.on { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .opt:active { transform: scale(.95); }
  .opt .caret { width: 12px; height: 12px; opacity: .6; }
  .hintline { margin: 7px 2px 0; font-size: 11.5px; color: var(--hint); min-height: 14px; }
  .hintline.bad { color: var(--danger); }
 
  /* ---------- Календарь ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-month { font-size: 17px; font-weight: 600; text-transform: capitalize; letter-spacing: -.01em; }
  .nav { display: flex; align-items: center; gap: 2px; }
  .nav button { width: 34px; height: 34px; border-radius: 9px; color: var(--text); display: flex; align-items: center; justify-content: center; }
  .nav button:active { background: var(--sec); }
  .nav svg { width: 18px; height: 18px; }
  .today-btn { font-size: 13px; font-weight: 600; color: var(--accent); padding: 6px 10px; border-radius: 9px; }
 
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 6px; }
  .wd { text-align: center; font-size: 11px; font-weight: 600; color: var(--hint); padding: 4px 0; }
  .wd.we { opacity: .6; }
  .day {
    aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border-radius: 11px; font-variant-numeric: tabular-nums; transition: background .18s, color .18s, transform .12s;
  }
  .day:active { transform: scale(.9); }
  .day .n { font-size: 14px; }
  .day.other { color: var(--hint); opacity: .4; }
  .day.we .n { color: var(--hint); }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .day.today .n { font-weight: 700; color: var(--accent); }
  .day.sel { background: var(--accent); }
  .day.sel .n, .day.sel.today .n { color: var(--accent-text); font-weight: 600; }
  .day.sel { box-shadow: none; }
  .dots { display: flex; gap: 2.5px; height: 4px; align-items: center; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .dot.done { background: var(--hint); }
  .dot.late { background: var(--danger); }
  .day.sel .dot { background: var(--accent-text); }
 
  .daypanel { margin-top: 14px; }
  .daypanel h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
  .daypanel h2 small { font-weight: 400; color: var(--hint); text-transform: none; margin-left: 6px; font-size: 13px; }
 
  /* ---------- Модалка ---------- */
  .sheet-bg {
    position: fixed; inset: 0; z-index: 40; background: var(--overlay);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: var(--bg); border-radius: var(--r-lg) var(--r-lg) 0 0;
    padding: 8px 16px calc(16px + var(--safe-b));
    transform: translateY(102%); transition: transform .3s cubic-bezier(.4,0,.2,1);
    max-width: 560px; margin: 0 auto; box-shadow: 0 -10px 40px var(--elev);
  }
  .sheet.open { transform: translateY(0); }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--hint); opacity: .3; margin: 0 auto 14px; }
  .sheet label { display: block; font-size: 12px; font-weight: 600; color: var(--hint); margin: 0 0 6px 2px; }
  .sheet input[type="text"] {
    width: 100%; padding: 11px 14px; border-radius: var(--r-md);
    border: 1.5px solid transparent; background: var(--sec); font-size: 15px;
  }
  .date-btn {
    width: 100%; display: flex; align-items: center; gap: 9px;
    padding: 11px 14px; border-radius: var(--r-md); background: var(--sec);
    font-size: 15px; text-align: left;
  }
  .date-btn svg:first-child { width: 17px; height: 17px; color: var(--hint); flex-shrink: 0; }
  .date-btn .val { flex: 1; }
  .date-btn .val.none { color: var(--hint); }
  .date-btn .caret { width: 14px; height: 14px; color: var(--hint); flex-shrink: 0; }
  .date-btn:active { opacity: .75; }
  .sheet input:focus { outline: none; border-color: var(--accent); }
  .sheet .fieldset { margin-bottom: 14px; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--sec); border-radius: var(--r-md); padding: 11px 14px; }
  .toggle-row span { font-size: 15px; }
  .switch { width: 46px; height: 28px; border-radius: 999px; background: var(--hint); opacity: .45; position: relative; transition: background .22s, opacity .22s; flex-shrink: 0; }
  .switch.on { background: var(--ok); opacity: 1; }
  .switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .22s cubic-bezier(.4,0,.2,1); }
  .switch.on i { transform: translateX(18px); }
  .sheet-bg.lvl2 { z-index: 50; }
  .sheet.lvl2 { z-index: 51; }
  .pick-quick { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
  .pick-quick::-webkit-scrollbar { display: none; }
  .pick-quick .chip.on { background: var(--accent); color: var(--accent-text); }
  #pick .cal-head { margin-bottom: 8px; }
  #pick-days { margin-bottom: 4px; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn { flex: 1; padding: 13px; border-radius: var(--r-md); font-size: 15px; font-weight: 600; text-align: center; }
  .btn.primary { background: var(--accent); color: var(--accent-text); }
  .btn.ghost { background: var(--sec); color: var(--danger); flex: 0 0 auto; padding: 13px 16px; display: flex; align-items: center; justify-content: center; }
  .btn.ghost svg { width: 18px; height: 18px; }
  .btn:active { opacity: .8; }
 
  /* ---------- Тост ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(150px + var(--safe-b)); z-index: 60;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 14px;
    background: var(--text); color: var(--bg);
    padding: 11px 14px; border-radius: var(--r-md); font-size: 14px;
    box-shadow: 0 8px 28px var(--elev); transition: opacity .24s, transform .24s;
    max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { font-weight: 700; color: var(--link); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
 
<div class="app">
  <header class="head">
    <div>
      <h1>Мои задачи</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="ring" id="ring" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 44 44">
        <circle class="track" cx="22" cy="22" r="19" fill="none" stroke-width="4"></circle>
        <circle class="bar" id="ringbar" cx="22" cy="22" r="19" fill="none" stroke-width="4" stroke-dasharray="119.4" stroke-dashoffset="119.4"></circle>
      </svg>
      <span id="ringtext">0%</span>
    </div>
  </header>
 
  <div class="tabs" id="tabs">
    <div class="glider"></div>
    <button class="tab active" id="tab-list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Список</button>
    <button class="tab" id="tab-cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Календарь</button>
  </div>
 
  <section id="view-list">
    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </section>
 
  <section id="view-cal" hidden>
    <div class="cal-head">
      <span class="cal-month" id="month-label"></span>
      <div class="nav">
        <button class="today-btn" id="btn-today">Сегодня</button>
        <button id="prev-month" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="next-month" aria-label="Следующий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
    <div class="grid" id="weekdays"></div>
    <div class="grid" id="days"></div>
    <div class="daypanel">
      <h2 id="day-label"></h2>
      <div id="day-list"></div>
    </div>
  </section>
</div>
 
<div class="composer">
  <div class="composer-in">
    <div class="field">
      <input id="new-task" type="text" placeholder="Что нужно сделать?" autocomplete="off" enterkeyhint="done" />
      <button class="send" id="add-btn" aria-label="Добавить задачу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="opts">
      <button class="opt on" id="opt-date" type="button" aria-label="Выбрать дату задачи">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span id="opt-date-label">Сегодня</span>
        <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button class="opt" id="opt-bell" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        Напомнить
      </button>
    </div>
    <p class="hintline" id="hintline"></p>
  </div>
</div>
 
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Редактирование задачи">
  <div class="grab"></div>
  <div class="fieldset">
    <label for="edit-text">Задача</label>
    <input type="text" id="edit-text" autocomplete="off" />
  </div>
  <div class="fieldset">
    <label>Срок</label>
    <button class="date-btn" id="edit-date" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span class="val" id="edit-date-label">Сегодня</span>
      <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="fieldset">
    <div class="toggle-row">
      <span>Напоминание</span>
      <button class="switch" id="edit-bell" role="switch" aria-checked="false"><i></i><span class="sr">Напоминание</span></button>
    </div>
  </div>
  <div class="sheet-actions">
    <button class="btn ghost" id="edit-del" aria-label="Удалить задачу"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg></button>
    <button class="btn primary" id="edit-save">Сохранить</button>
  </div>
</div>
 
<div class="sheet-bg lvl2" id="pick-bg"></div>
<div class="sheet lvl2" id="pick" role="dialog" aria-modal="true" aria-label="Выбор даты">
  <div class="grab"></div>
  <div class="pick-quick" id="pick-quick"></div>
  <div class="cal-head">
    <span class="cal-month" id="pick-month"></span>
    <div class="nav">
      <button id="pick-prev" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="pick-next" aria-label="Следующий месяц"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
  <div class="grid" id="pick-weekdays"></div>
  <div class="grid" id="pick-days"></div>
</div>
 
<div class="toast" id="toast"><span id="toast-text"></span><button id="toast-undo">Отменить</button></div>
 
<script>
(function () {
  'use strict';
 
  /* =====================  Telegram  ===================== */
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.enableClosingConfirmation) { try { tg.enableClosingConfirmation(); } catch (e) {} }
  }
  function haptic(kind, style) {
    if (!tg || !tg.HapticFeedback) return;
    try {
      if (kind === 'impact') tg.HapticFeedback.impactOccurred(style || 'light');
      else if (kind === 'notify') tg.HapticFeedback.notificationOccurred(style || 'success');
      else tg.HapticFeedback.selectionChanged();
    } catch (e) {}
  }
  function applyScheme() {
    var dark = tg && tg.colorScheme
      ? tg.colorScheme === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-scheme', dark ? 'dark' : 'light');
  }
  applyScheme();
  if (tg && tg.onEvent) tg.onEvent('themeChanged', applyScheme);
  if (window.matchMedia) {
    try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyScheme); } catch (e) {}
  }
 
  /* =====================  Даты  ===================== */
  var MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
  var WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
 
  function key(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function parseKey(s) {
    var p = String(s).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  function isKey(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function shift(s, n) {
    var d = parseKey(s); d.setDate(d.getDate() + n); return key(d);
  }
  var TODAY = key(new Date());
  var TOMORROW = shift(TODAY, 1);
 
  function humanDate(s) {
    if (!s) return 'Без срока';
    if (s === TODAY) return 'Сегодня';
    if (s === TOMORROW) return 'Завтра';
    if (s === shift(TODAY, -1)) return 'Вчера';
    var d = parseKey(s);
    var t = d.getDate() + ' ' + MONTHS_GEN[d.getMonth()];
    if (d.getFullYear() !== new Date().getFullYear()) t += ' ' + d.getFullYear();
    return t;
  }
 
  /* =====================  Хранилище  ===================== */
  var KEY = 'todo_tasks_v2';
  var LEGACY = 'todo_tasks_v1';
  var tasks = [];
  var nextId = 1;
  var saveTimer = null;
 
  function normalize(t) {
    return {
      id: typeof t.id === 'number' ? t.id : 0,
      text: String(t.text == null ? '' : t.text).slice(0, 500),
      date: isKey(t.date) ? t.date : null,
      done: !!t.done,
      remind: !!t.remind,
      createdAt: typeof t.createdAt === 'number' ? t.createdAt : Date.now()
    };
  }
  function serialize() { return JSON.stringify({ v: 2, tasks: tasks, nextId: nextId }); }
 
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var payload = serialize();
      try { localStorage.setItem(KEY, payload); } catch (e) {}
      if (tg && tg.CloudStorage && tg.CloudStorage.setItem) {
        try { tg.CloudStorage.setItem(KEY, payload, function () {}); } catch (e) {}
      }
    }, 250);
  }
 
  function parse(raw) {
    if (!raw) return null;
    try {
      var d = JSON.parse(raw);
      if (!d || !Array.isArray(d.tasks)) return null;
      var list = d.tasks.map(normalize);
      var max = 0;
      list.forEach(function (t) { if (t.id > max) max = t.id; });
      list.forEach(function (t) { if (!t.id) t.id = ++max; });
      return { tasks: list, nextId: Math.max(d.nextId || 0, max + 1) };
    } catch (e) { return null; }
  }
 
  function seed() {
    return {
      tasks: [
        { id: 1, text: 'Отправить документ в HR', date: TODAY, done: false, remind: true, createdAt: Date.now() },
        { id: 2, text: 'Проверить прототип', date: TOMORROW, done: false, remind: false, createdAt: Date.now() },
        { id: 3, text: 'Записаться к врачу', date: null, done: false, remind: false, createdAt: Date.now() }
      ],
      nextId: 4
    };
  }
 
  function load(done) {
    var local = null;
    try { local = parse(localStorage.getItem(KEY)) || parse(localStorage.getItem(LEGACY)); } catch (e) {}
    var settled = false;
    function finish(data) {
      if (settled) return;
      settled = true;
      var d = data || local || seed();
      tasks = d.tasks;
      nextId = d.nextId;
      done();
    }
    if (tg && tg.CloudStorage && tg.CloudStorage.getItem) {
      var timer = setTimeout(function () { finish(null); }, 1500); // облако молчит — не держим экран
      try {
        tg.CloudStorage.getItem(KEY, function (err, value) {
          clearTimeout(timer);
          finish(err ? null : parse(value));
        });
      } catch (e) { clearTimeout(timer); finish(null); }
    } else {
      finish(null);
    }
  }
 
  /* =====================  Состояние UI  ===================== */
  var view = 'list';
  var filter = 'all';
  var draftDate = TODAY;
  var draftRemind = false;
  var curMonth = (function () { var d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })();
  var selected = TODAY;
  var editingId = null;
  var editDraft = null;
  var pendingDelete = null;
  var toastTimer = null;
 
  var $ = function (id) { return document.getElementById(id); };
 
  var ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.2 5.2L20 7"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>',
    inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h4l2 3h4l2-3h4"/><path d="M5 6h14l2 7v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/></svg>'
  };
 
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
 
  /* =====================  Рендер списка  ===================== */
  function isLate(t) { return !t.done && t.date && t.date < TODAY; }
 
  function makeRow(t, compact) {
    var row = document.createElement('div');
    row.className = 'row' + (t.done ? ' is-done' : '');
    var late = isLate(t);
    var dateHtml = compact
      ? ''
      : '<span class="pill' + (late ? ' late' : '') + '">' + ICON.cal + humanDate(t.date) + '</span>';
    var bellHtml = t.remind ? '<span class="pill bell">' + ICON.bell + 'напоминание</span>' : '';
    var meta = dateHtml + bellHtml;
 
    row.innerHTML =
      '<button class="check' + (t.done ? ' on' : '') + '" aria-label="Отметить выполненной" aria-pressed="' + t.done + '">' + (t.done ? ICON.check : '') + '</button>' +
      '<button class="body" aria-label="Изменить задачу">' +
        '<p class="title' + (t.done ? ' struck' : '') + '">' + esc(t.text) + '</p>' +
        (meta ? '<p class="meta">' + meta + '</p>' : '') +
      '</button>' +
      '<button class="del" aria-label="Удалить задачу">' + ICON.trash + '</button>';
 
    row.querySelector('.check').addEventListener('click', function () { toggle(t.id); });
    row.querySelector('.body').addEventListener('click', function () { openSheet(t.id); });
    row.querySelector('.del').addEventListener('click', function () { removeTask(t.id); });
    return row;
  }
 
  function emptyState(text) {
    var d = document.createElement('div');
    d.className = 'empty';
    d.innerHTML = ICON.inbox + '<p>' + esc(text) + '</p>';
    return d;
  }
 
  function byFilter(list) {
    if (filter === 'active') return list.filter(function (t) { return !t.done; });
    if (filter === 'done') return list.filter(function (t) { return t.done; });
    return list;
  }
 
  function sortTasks(a, b) {
    if (a.date && b.date && a.date !== b.date) return a.date < b.date ? -1 : 1;
    if (a.date && !b.date) return -1;
    if (!a.date && b.date) return 1;
    return a.createdAt - b.createdAt;
  }
 
  function renderFilters() {
    var counts = {
      all: tasks.length,
      active: tasks.filter(function (t) { return !t.done; }).length,
      done: tasks.filter(function (t) { return t.done; }).length
    };
    var defs = [['all', 'Все'], ['active', 'Активные'], ['done', 'Выполненные']];
    var wrap = $('filters');
    wrap.innerHTML = '';
    defs.forEach(function (d) {
      var b = document.createElement('button');
      b.className = 'chip' + (filter === d[0] ? ' on' : '');
      b.innerHTML = esc(d[1]) + '<span class="cnt">' + counts[d[0]] + '</span>';
      b.addEventListener('click', function () { filter = d[0]; haptic('select'); renderList(); });
      wrap.appendChild(b);
    });
  }
 
  function renderHeader() {
    var total = tasks.length;
    var done = tasks.filter(function (t) { return t.done; }).length;
    var late = tasks.filter(isLate).length;
    var pct = total ? Math.round(done / total * 100) : 0;
    var C = 119.4;
    $('ringbar').style.strokeDashoffset = String(C - C * pct / 100);
    $('ringtext').textContent = pct + '%';
    var parts = [];
    if (total === 0) parts.push('Список пуст');
    else parts.push(done + ' из ' + total + ' готово');
    if (late) parts.push(late + ' просрочено');
    $('subtitle').textContent = parts.join(' · ');
  }
 
  function renderList() {
    renderHeader();
    renderFilters();
    var wrap = $('list');
    wrap.innerHTML = '';
    var list = byFilter(tasks).slice().sort(sortTasks);
    if (!list.length) {
      wrap.appendChild(emptyState(
        filter === 'done' ? 'Пока ничего не выполнено' :
        filter === 'active' ? 'Все задачи выполнены' : 'Задач пока нет'
      ));
      return;
    }
    var buckets = [
      { k: 'late', title: 'Просрочено', cls: 'overdue', items: [] },
      { k: 'today', title: 'Сегодня', items: [] },
      { k: 'tomorrow', title: 'Завтра', items: [] },
      { k: 'later', title: 'Позже', items: [] },
      { k: 'none', title: 'Без срока', items: [] },
      { k: 'done', title: 'Выполнено', items: [] }
    ];
    var map = {};
    buckets.forEach(function (b) { map[b.k] = b; });
    list.forEach(function (t) {
      if (t.done) map.done.items.push(t);
      else if (!t.date) map.none.items.push(t);
      else if (t.date < TODAY) map.late.items.push(t);
      else if (t.date === TODAY) map.today.items.push(t);
      else if (t.date === TOMORROW) map.tomorrow.items.push(t);
      else map.later.items.push(t);
    });
    buckets.forEach(function (b) {
      if (!b.items.length) return;
      var sec = document.createElement('div');
      sec.className = 'group';
      var h = document.createElement('p');
      h.className = 'group-title' + (b.cls ? ' ' + b.cls : '');
      h.innerHTML = esc(b.title) + '<span class="n">' + b.items.length + '</span>';
      sec.appendChild(h);
      b.items.forEach(function (t) { sec.appendChild(makeRow(t)); });
      wrap.appendChild(sec);
    });
  }
 
  /* =====================  Календарь  ===================== */
  function renderWeekdays(el) {
    if (el.childElementCount) return;
    WEEKDAYS.forEach(function (d, i) {
      var cell = document.createElement('div');
      cell.className = 'wd' + (i > 4 ? ' we' : '');
      cell.textContent = d;
      el.appendChild(cell);
    });
  }
 
  // Одна сетка месяца для календаря и для выбора даты
  function buildMonth(grid, month, selKey, opts, onPick) {
    grid.innerHTML = '';
    var first = new Date(month.getFullYear(), month.getMonth(), 1);
    var lead = (first.getDay() + 6) % 7;
    var start = new Date(first);
    start.setDate(start.getDate() - lead);
    var total = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
    var cells = Math.ceil((lead + total) / 7) * 7;
 
    for (var i = 0; i < cells; i++) {
      var d = new Date(start);
      d.setDate(start.getDate() + i);
      var ks = key(d);
      var cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'day' +
        (d.getMonth() !== month.getMonth() ? ' other' : '') +
        (i % 7 > 4 ? ' we' : '') +
        (ks === TODAY ? ' today' : '') +
        (ks === selKey ? ' sel' : '');
      var dots = '';
      var n = 0;
      if (opts && opts.dots) {
        var dayTasks = tasks.filter(function (t) { return t.date === ks; });
        n = dayTasks.length;
        dots = dayTasks.slice(0, 3).map(function (t) {
          return '<span class="dot' + (t.done ? ' done' : isLate(t) ? ' late' : '') + '"></span>';
        }).join('');
      }
      cell.innerHTML = '<span class="n">' + d.getDate() + '</span><span class="dots">' + dots + '</span>';
      cell.setAttribute('aria-label', d.getDate() + ' ' + MONTHS_GEN[d.getMonth()] + (opts && opts.dots ? ', задач: ' + n : ''));
      (function (ks2, dd) {
        cell.addEventListener('click', function () { onPick(ks2, dd); });
      })(ks, d);
      grid.appendChild(cell);
    }
  }
 
  function renderCalendar() {
    renderWeekdays($('weekdays'));
    $('month-label').textContent = MONTHS_NOM[curMonth.getMonth()] + ' ' + curMonth.getFullYear();
    buildMonth($('days'), curMonth, selected, { dots: true }, function (ks, d) {
      selected = ks;
      if (d.getMonth() !== curMonth.getMonth()) curMonth = new Date(d.getFullYear(), d.getMonth(), 1);
      haptic('select');
      renderCalendar();
    });
 
    var d2 = parseKey(selected);
    var label = d2.getDate() + ' ' + MONTHS_GEN[d2.getMonth()];
    var rel = humanDate(selected);
    $('day-label').innerHTML = esc(label) + (rel !== label ? '<small>' + esc(rel.toLowerCase()) + '</small>' : '');
 
    var box = $('day-list');
    box.innerHTML = '';
    var dayTasks2 = tasks.filter(function (t) { return t.date === selected; }).sort(sortTasks);
    if (!dayTasks2.length) box.appendChild(emptyState('Нет задач на этот день'));
    else dayTasks2.forEach(function (t) { box.appendChild(makeRow(t, true)); });
 
    // новые задачи по умолчанию падают на выбранный день
    setDraftDate(selected);
  }
 
  /* =====================  Действия  ===================== */
  function find(id) {
    for (var i = 0; i < tasks.length; i++) if (tasks[i].id === id) return tasks[i];
    return null;
  }
  function refresh() { if (view === 'list') renderList(); else { renderHeader(); renderCalendar(); } }
 
  function toggle(id) {
    var t = find(id);
    if (!t) return;
    t.done = !t.done;
    haptic('notify', t.done ? 'success' : 'warning');
    save();
    refresh();
  }
 
  function removeTask(id) {
    var idx = -1;
    for (var i = 0; i < tasks.length; i++) if (tasks[i].id === id) { idx = i; break; }
    if (idx < 0) return;
    pendingDelete = { task: tasks[idx], index: idx };
    tasks.splice(idx, 1);
    haptic('impact', 'medium');
    save();
    refresh();
    showToast('Задача удалена');
  }
 
  function showToast(text) {
    clearTimeout(toastTimer);
    $('toast-text').textContent = text;
    $('toast').classList.add('show');
    toastTimer = setTimeout(function () {
      $('toast').classList.remove('show');
      pendingDelete = null;
    }, 5000);
  }
  $('toast-undo').addEventListener('click', function () {
    if (!pendingDelete) return;
    tasks.splice(Math.min(pendingDelete.index, tasks.length), 0, pendingDelete.task);
    pendingDelete = null;
    clearTimeout(toastTimer);
    $('toast').classList.remove('show');
    haptic('notify', 'success');
    save();
    refresh();
  });
 
  /* ---------- выбор даты ---------- */
  var picker = { month: null, value: null, cb: null, open: false };
 
  function nextWeekday(target) { // ближайший будущий день недели (1=Пн … 7=Вс)
    var d = new Date();
    var cur = d.getDay() === 0 ? 7 : d.getDay();
    var add = (target - cur + 7) % 7 || 7;
    d.setDate(d.getDate() + add);
    return key(d);
  }
 
  function renderPicker() {
    $('pick-month').textContent = MONTHS_NOM[picker.month.getMonth()] + ' ' + picker.month.getFullYear();
    renderWeekdays($('pick-weekdays'));
 
    var quick = [
      { label: 'Сегодня', val: TODAY },
      { label: 'Завтра', val: TOMORROW },
      { label: 'Пн', val: nextWeekday(1) },
      { label: 'Без срока', val: null }
    ];
    var qw = $('pick-quick');
    qw.innerHTML = '';
    quick.forEach(function (q) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (picker.value === q.val ? ' on' : '');
      b.textContent = q.label;
      if (q.val) b.title = humanDate(q.val);
      b.addEventListener('click', function () { commitPick(q.val); });
      qw.appendChild(b);
    });
 
    buildMonth($('pick-days'), picker.month, picker.value, null, function (ks) { commitPick(ks); });
  }
 
  function openPicker(value, cb) {
    picker.value = isKey(value) ? value : null;
    var base = picker.value ? parseKey(picker.value) : new Date();
    picker.month = new Date(base.getFullYear(), base.getMonth(), 1);
    picker.cb = cb;
    picker.open = true;
    renderPicker();
    $('pick-bg').classList.add('open');
    $('pick').classList.add('open');
    haptic('impact', 'light');
    if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
  }
  function closePicker() {
    picker.open = false;
    picker.cb = null;
    $('pick-bg').classList.remove('open');
    $('pick').classList.remove('open');
    if (tg && tg.BackButton && editingId === null) { try { tg.BackButton.hide(); } catch (e) {} }
  }
  function commitPick(val) {
    var cb = picker.cb;
    haptic('select');
    closePicker();
    if (cb) cb(val);
  }
  $('pick-bg').addEventListener('click', closePicker);
  $('pick-prev').addEventListener('click', function () {
    picker.month = new Date(picker.month.getFullYear(), picker.month.getMonth() - 1, 1);
    haptic('select'); renderPicker();
  });
  $('pick-next').addEventListener('click', function () {
    picker.month = new Date(picker.month.getFullYear(), picker.month.getMonth() + 1, 1);
    haptic('select'); renderPicker();
  });
 
  /* ---------- композер ---------- */
  function setDraftDate(dateKey) {
    draftDate = isKey(dateKey) ? dateKey : null;
    $('opt-date').classList.toggle('on', !!draftDate);
    $('opt-date-label').textContent = draftDate ? humanDate(draftDate) : 'Без срока';
  }
  function setDraftRemind(on) {
    draftRemind = on;
    $('opt-bell').classList.toggle('on', on);
    $('opt-bell').setAttribute('aria-pressed', String(on));
  }
 
  $('opt-date').addEventListener('click', function () {
    openPicker(draftDate, function (val) { setDraftDate(val); });
  });
  $('opt-bell').addEventListener('click', function () {
    setDraftRemind(!draftRemind);
    haptic('select');
    hint(draftRemind ? 'Напоминание отметится в задаче — отправляет его бот' : '');
  });
 
  var hintTimer = null;
  function hint(text, bad) {
    clearTimeout(hintTimer);
    var el = $('hintline');
    el.textContent = text;
    el.classList.toggle('bad', !!bad);
    if (text) hintTimer = setTimeout(function () { el.textContent = ''; el.classList.remove('bad'); }, 3500);
  }
 
  function addTask() {
    var input = $('new-task');
    var val = input.value.trim();
    if (!val) {
      input.classList.add('err');
      hint('Введите текст задачи', true);
      haptic('notify', 'error');
      setTimeout(function () { input.classList.remove('err'); }, 1200);
      input.focus();
      return;
    }
    input.classList.remove('err');
    tasks.push(normalize({ id: nextId++, text: val, date: draftDate, done: false, remind: draftRemind, createdAt: Date.now() }));
    input.value = '';
    setDraftRemind(false);
    haptic('notify', 'success');
    save();
    if (view === 'cal' && draftDate) { selected = draftDate; curMonth = new Date(parseKey(draftDate).getFullYear(), parseKey(draftDate).getMonth(), 1); }
    refresh();
    hint(draftDate ? 'Добавлено на ' + humanDate(draftDate).toLowerCase() : 'Добавлено без срока');
  }
  $('add-btn').addEventListener('click', addTask);
  $('new-task').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addTask(); } });
  $('new-task').addEventListener('input', function () { this.classList.remove('err'); });
 
  /* ---------- модалка редактирования ---------- */
  function openSheet(id) {
    var t = find(id);
    if (!t) return;
    editingId = id;
    editDraft = { remind: t.remind, date: t.date };
    $('edit-text').value = t.text;
    setEditDate(t.date);
    $('edit-bell').classList.toggle('on', t.remind);
    $('edit-bell').setAttribute('aria-checked', String(t.remind));
    $('sheet-bg').classList.add('open');
    $('sheet').classList.add('open');
    haptic('impact', 'light');
    if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
  }
  function setEditDate(val) {
    editDraft.date = isKey(val) ? val : null;
    var el = $('edit-date-label');
    el.textContent = editDraft.date ? humanDate(editDraft.date) : 'Без срока';
    el.classList.toggle('none', !editDraft.date);
  }
  function closeSheet() {
    editingId = null;
    $('sheet-bg').classList.remove('open');
    $('sheet').classList.remove('open');
    if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch (e) {} }
  }
  if (tg && tg.onEvent) tg.onEvent('backButtonClicked', function () {
    if (picker.open) closePicker(); else closeSheet();
  });
 
  $('sheet-bg').addEventListener('click', closeSheet);
  $('edit-date').addEventListener('click', function () {
    openPicker(editDraft.date, function (val) { setEditDate(val); });
  });
  $('edit-bell').addEventListener('click', function () {
    editDraft.remind = !editDraft.remind;
    this.classList.toggle('on', editDraft.remind);
    this.setAttribute('aria-checked', String(editDraft.remind));
    haptic('select');
  });
  $('edit-save').addEventListener('click', function () {
    var t = find(editingId);
    if (!t) return closeSheet();
    var text = $('edit-text').value.trim();
    if (!text) { $('edit-text').focus(); haptic('notify', 'error'); return; }
    t.text = text.slice(0, 500);
    t.date = editDraft.date;
    t.remind = editDraft.remind;
    haptic('notify', 'success');
    save();
    if (t.date) selected = t.date;
    closeSheet();
    refresh();
  });
  $('edit-del').addEventListener('click', function () {
    var id = editingId;
    closeSheet();
    removeTask(id);
  });
  $('edit-text').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('edit-save').click(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (picker.open) closePicker();
    else if (editingId !== null) closeSheet();
  });
 
  /* ---------- вкладки ---------- */
  function setView(next) {
    view = next;
    var isList = next === 'list';
    $('view-list').hidden = !isList;
    $('view-cal').hidden = isList;
    $('tabs').classList.toggle('cal', !isList);
    $('tab-list').classList.toggle('active', isList);
    $('tab-cal').classList.toggle('active', !isList);
    haptic('select');
    if (isList) { setDraftDate(draftDate); renderList(); } else renderCalendar();
  }
  $('tab-list').addEventListener('click', function () { setView('list'); });
  $('tab-cal').addEventListener('click', function () { setView('cal'); });
 
  $('prev-month').addEventListener('click', function () {
    curMonth = new Date(curMonth.getFullYear(), curMonth.getMonth() - 1, 1);
    haptic('select'); renderCalendar();
  });
  $('next-month').addEventListener('click', function () {
    curMonth = new Date(curMonth.getFullYear(), curMonth.getMonth() + 1, 1);
    haptic('select'); renderCalendar();
  });
  $('btn-today').addEventListener('click', function () {
    var d = new Date();
    curMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    selected = TODAY;
    haptic('select'); renderCalendar();
  });
 
  // свайп по сетке месяцев
  (function () {
    var x0 = null, y0 = null;
    var grid = $('days');
    grid.addEventListener('touchstart', function (e) {
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    grid.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0;
      var dy = e.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) {
        curMonth = new Date(curMonth.getFullYear(), curMonth.getMonth() + (dx < 0 ? 1 : -1), 1);
        haptic('impact', 'light');
        renderCalendar();
      }
    }, { passive: true });
  })();
 
  /* =====================  Старт  ===================== */
  setDraftDate(TODAY);
  setDraftRemind(false);
  load(function () { renderList(); });
})();
</script>
</body>
</html>
